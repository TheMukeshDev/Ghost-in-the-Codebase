services:
  - type: web
    name: ghost-in-the-codebase-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://ghost-in-the-codebase.vercel.app
      - key: UPLOAD_MAX_SIZE_MB
        value: "100"
